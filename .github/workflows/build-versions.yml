name: Build ComfyUI Version Packages

on:
  workflow_dispatch:
    inputs:
      versions:
        description: '要构建的 ComfyUI 版本（JSON 数组，如 ["0.3.39","0.3.40"]）'
        required: true
        default: '["0.3.39"]'
      torch_baseline:
        description: "torch 基线版本（写入 manifest，构建时不安装）"
        required: false
        default: "2.4.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJSON(inputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc             /usr/local/.ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build package
        env:
          PYTHON_ABI: "3.11"
          TORCH_BASELINE: ${{ inputs.torch_baseline }}
        run: bash packaging/build_comfy_version.sh "${{ matrix.version }}" "${{ inputs.torch_baseline }}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.version }}
          path: |
            dist/comfyui-*.tar.zst
            dist/manifest-*.json

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find dist-all -name 'comfyui-*.tar.zst' -exec mv {} dist/ \;
          find dist-all -name 'manifest-*.json' -exec mv {} dist/ \;
      - name: Generate index
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python packaging/generate_versions_index.py --manifests dist --out dist/versions-index.json
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: versions-${{ github.run_id }}
          name: ComfyUI 版本包 ${{ inputs.versions }}
          files: |
            dist/comfyui-*.tar.zst
            dist/comfyui-*.tar.zst.part*
            dist/versions-index.json
          fail_on_unmatched_files: true
